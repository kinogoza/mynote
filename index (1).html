<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c4bd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inkfold">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;-webkit-user-select:none;user-select:none}.obj,input,[contenteditable]{-webkit-user-select:text;user-select:text}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Inkfold ノート</title>
</head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Klee+One:wght@400;600&display=swap">
<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<style>
/* Layout: 左に本棚(ノート/ページ)、上にツール帯、中央に紙。紙は手書き・テキスト・付箋・図形・画像を同じ層に置く */
:root{
  --bg:#eceae4; --panel:#f8f7f3; --paper:#fffefb; --ink:#1f2430; --muted:#6c6f78; --line:#d9d6cd;
  --accent:#2c4bd1; --accent-soft:#e3e8fb; --rule:#c9d3ee; --danger:#c43d3d;
  --f-display:"Shippori Mincho",serif; --f-body:"Zen Kaku Gothic New",system-ui,sans-serif; --f-hand:"Klee One","Zen Kaku Gothic New",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--panel:#1d2027;--paper:#23262e;--ink:#e8e9ee;--muted:#9a9eaa;--line:#343843;--accent:#8ea2ff;--accent-soft:#2a3150;--rule:#36405c;--danger:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--panel:#1d2027;--paper:#23262e;--ink:#e8e9ee;--muted:#9a9eaa;--line:#343843;--accent:#8ea2ff;--accent-soft:#2a3150;--rule:#36405c;--danger:#ff7b7b;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{font-family:var(--f-display);font-size:22px;padding:16px 16px 8px;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em}
.search{margin:4px 16px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:calc(100% - 32px)}
.sec{font-size:11px;letter-spacing:.1em;color:var(--muted);padding:10px 16px 4px;display:flex;justify-content:space-between;align-items:center}
.sec button{border:0;background:none;color:var(--accent);font-size:18px;line-height:1;padding:0 4px}
.list{overflow:auto;padding:0 8px;min-height:0}
.nb{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.nb:hover{background:var(--accent-soft)}
.nb.on{background:var(--accent-soft);font-weight:700}
.cover{width:22px;height:28px;border-radius:2px 4px 4px 2px;flex:none;box-shadow:inset 3px 0 0 rgba(0,0,0,.18)}
.nb .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pages{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:4px 16px 16px;align-content:start}
.thumb{border:1px solid var(--line);border-radius:4px;background:var(--paper);aspect-ratio:3/4;position:relative;padding:0;overflow:hidden}
.thumb.on{outline:2px solid var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;top:4px;left:4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:700;line-height:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.thumb.on span{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.pnav{display:flex;align-items:center;gap:4px}
.pnav button{width:28px;height:28px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:0}
.pnav button:disabled{opacity:.35;cursor:default}
.pnav input{width:44px;height:28px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-weight:700;font-variant-numeric:tabular-nums}
.pnav .of{color:var(--muted)}
.pgno{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.snapst{font-size:11px;color:var(--muted);padding:0 16px 6px}
.hit{font-size:12px;padding:6px 8px;border-radius:6px;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.hit:hover{background:var(--accent-soft)}
.hit b{color:var(--accent)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.grp{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.tb{border:0;background:none;border-radius:8px;min-width:34px;height:32px;padding:0 8px;display:grid;place-items:center;font-size:13px}
.tb:hover{background:var(--accent-soft)}
.tb.on{background:var(--accent);color:var(--paper)}
.tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
input[type=range]{width:80px;accent-color:var(--accent)}
select{border:1px solid var(--line);border-radius:8px;background:var(--paper);height:32px;padding:0 6px}
.title{font-family:var(--f-display);font-size:16px;border:0;background:none;min-width:0;flex:1 1 120px;padding:4px}
.stage{flex:1;overflow:auto;position:relative;min-height:0;touch-action:pan-x pan-y;display:flex;align-items:flex-start;gap:16px;padding:24px 16px}
.stage.spread{gap:4px}
.stage .sheet{margin:0}
.stage:not(.spread) .sheet{margin:0 auto}
.stage.spread>:first-child{margin-left:auto}.stage.spread>:last-child{margin-right:auto}
.sheet2{position:relative;flex:none;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);cursor:pointer;padding:0;border:0;opacity:.92}
.sheet2:hover{opacity:1;outline:2px solid var(--accent-soft)}
.sheet2 img{width:100%;height:100%;display:block}
.sheet2.empty{background:transparent;box-shadow:none;border:1px dashed var(--line);cursor:default;opacity:1;outline:0}
.sheet2 .hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;background:var(--panel);color:var(--muted);padding:3px 10px;border-radius:10px;border:1px solid var(--line)}
.sheet2 .pgno{bottom:14px}
.vmode{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vmode button{border:0!important;border-radius:0!important;background:var(--paper)}
.vmode button.on{background:var(--accent)!important;color:var(--paper)}
.a4{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.sheet{position:relative;flex:none;margin:24px auto;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);transform-origin:top center}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%}
#bgc{pointer-events:none}
.objs{position:absolute;inset:0;pointer-events:none}
.obj{position:absolute;pointer-events:auto}
.obj.txt{font-family:var(--f-hand);font-size:20px;line-height:1.5;min-width:40px;min-height:30px;padding:2px 4px;outline:none;white-space:pre-wrap}
.obj.cells{text-spacing-trim:space-all;text-autospace:no-autospace;font-kerning:none;font-feature-settings:"palt" 0,"halt" 0;font-variant-east-asian:full-width;line-break:anywhere;overflow-wrap:anywhere}
.obj.sticky{font-family:var(--f-hand);font-size:17px;padding:10px;width:180px;min-height:140px;box-shadow:0 3px 8px rgba(0,0,0,.15);color:#2a2a2a;outline:none;white-space:pre-wrap}
.obj.img img{width:100%;height:100%;display:block;pointer-events:none}
.obj.sel{outline:2px dashed var(--accent);outline-offset:3px}
.grip{position:absolute;right:-8px;bottom:-8px;width:14px;height:14px;background:var(--accent);border-radius:3px;cursor:nwse-resize}
.mode-draw .obj{pointer-events:none}
.status{display:flex;gap:12px;align-items:center;padding:6px 12px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.status .sp{flex:1}
.status button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 8px}
.menuBtn{display:none}
.status{flex-wrap:wrap;row-gap:6px}
@media (max-width:760px){.status .hintx,#pinfo,.status .sp{display:none}}
.filebar{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px 16px 8px}
.fb{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 6px;font-size:12px;text-align:center;cursor:pointer}
.fb:hover{background:var(--accent-soft)}
.fb.hist{grid-column:1/-1}
.remind{margin:0 16px 8px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.remind button{border:0;background:var(--accent);color:var(--paper);border-radius:6px;padding:4px 8px;font-size:12px}
.histp{position:fixed;left:16px;top:16px;width:min(340px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:35;padding:12px}
.hh{display:flex;justify-content:space-between;align-items:center;font-size:15px}.hh button{border:0;background:none;font-size:16px}
.hn{font-size:12px;color:var(--muted);margin:6px 0 10px}
.hrow{display:flex;align-items:center;gap:8px;padding:8px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.hrow .m{flex:1;min-width:0}.hrow small{display:block;color:var(--muted);font-size:11px}
.hrow button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap}
.hrow button.arm{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:40}
.busy div{background:var(--panel);color:var(--ink);padding:16px 22px;border-radius:12px;font-variant-numeric:tabular-nums}
main{position:relative}
.ctx{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:10}
.ctx .cl{font-size:12px;color:var(--muted);padding-right:4px;font-weight:700}
.ctx .cb{border:1px solid var(--line);background:var(--paper);border-radius:8px;height:30px;padding:0 10px;font-size:12px}
.ctx .cb:hover{background:var(--accent-soft)}
.ctx .cb.danger{color:var(--danger)}
.ctx .cb.x{border:0;background:none}
.obj.sticky{padding-top:22px}
.handle{position:absolute;left:0;right:0;top:0;height:18px;cursor:grab;pointer-events:auto;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 6px) center/36px 4px no-repeat;touch-action:none}
.mode-draw .obj .handle{pointer-events:auto}
.handle.tgrip{left:-24px;right:auto;top:2px;width:18px;height:26px;border-radius:5px;background:radial-gradient(circle,var(--muted) 1.4px,transparent 1.6px) 0 0/6px 6px;opacity:.35}
.obj.txt:hover .tgrip,.obj.txt:focus .tgrip,.obj.txt.sel .tgrip{opacity:1;background-color:var(--accent-soft)}
@media (pointer:coarse){.handle.tgrip{opacity:.7;width:22px;left:-28px}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .menuBtn{display:grid}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
</style>

<div class="app">
<aside id="side">
  <div class="brand">Inkfold <small>手書き × テキスト × 整理</small></div>
  <input class="search" id="q" placeholder="全ノートのテキストを検索" aria-label="検索">
  <div id="hits" class="list"></div>
  <div class="filebar">
    <label class="fb" title="PDFを読み込んで書き込む">PDFを開く<input type="file" id="pdfIn" accept="application/pdf,.pdf" hidden></label>
    <button class="fb" id="pdfOut" title="このノートをPDFで保存">PDFで保存</button>
    <button class="fb" id="bakOut" title="全ノートをファイルに書き出す">バックアップ</button>
    <label class="fb" title="バックアップファイルから復元">復元<input type="file" id="bakIn" accept=".json,application/json" hidden></label>
    <button class="fb hist" id="histBtn" title="自動で残した履歴から戻す">自動履歴から戻す</button>
  </div>
  <div class="snapst" id="snapst"></div>
  <div class="remind" id="remind" hidden><span id="remindTx"></span><button id="remindGo">今すぐ書き出す</button></div>
  <div class="histp" id="histp" hidden><div class="hh"><b>自動履歴</b><button id="histClose" aria-label="閉じる">✕</button></div><p class="hn">書くたびに最新の履歴を更新し、5分ごとに新しい履歴を作ります（最大30件・この端末内）。</p><div id="histList"></div></div>
  <div class="sec">ノートブック <button id="addNb" title="ノートを追加" aria-label="ノートを追加">＋</button></div>
  <div class="list" id="nbs" style="max-height:34%"></div>
  <div class="sec">ページ <button id="addPg" title="ページを追加" aria-label="ページを追加">＋</button></div>
  <div class="pages list" id="pgs"></div>
</aside>
<main>
  <div class="bar">
    <button class="tb menuBtn" id="menu" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <input class="title" id="title" aria-label="ノート名">
    <div class="grp" id="tools">
      <button class="tb" data-t="pen" title="ペン (P)"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></button>
      <button class="tb" data-t="hl" title="蛍光ペン (H)"><svg viewBox="0 0 24 24"><path d="M9 14l-4 6h6l1-2M9 14l7-10 4 3-7 10z"/></svg></button>
      <button class="tb" data-t="erase" title="消しゴム (E)"><svg viewBox="0 0 24 24"><path d="M8 20h12M5 15l9-9 5 5-8 8H8z"/></svg></button>
      <button class="tb" data-t="line" title="直線"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
      <button class="tb" data-t="rect" title="四角"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"/></svg></button>
      <button class="tb" data-t="ellipse" title="円"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
      <button class="tb" data-t="arrow" title="矢印"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M11 5h8v8"/></svg></button>
      <button class="tb" data-t="text" title="テキスト (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button class="tb" data-t="sticky" title="付箋"><svg viewBox="0 0 24 24"><path d="M4 4h16v10l-6 6H4zM14 20v-6h6"/></svg></button>
      <button class="tb" data-t="select" title="選択・移動 (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
    </div>
    <div class="grp" id="colors" style="padding:5px;gap:6px"></div>
    <input type="range" id="size" min="1" max="24" value="3" aria-label="太さ" title="太さ">
    <select id="paper" aria-label="用紙">
      <option value="blank">無地</option><option value="lined">罫線</option><option value="grid">方眼</option>
      <option value="dot">ドット</option><option value="cornell">コーネル</option><option value="music">五線譜</option><option value="genko">原稿用紙</option>
    </select>
    <div class="grp">
      <button class="tb" id="undo" title="元に戻す (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 010 10h-3"/></svg></button>
      <button class="tb" id="redo" title="やり直し"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 000 10h3"/></svg></button>
      <label class="tb" title="画像を挿入" style="cursor:pointer"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 16l5-5 5 5 3-3 5 5"/></svg><input type="file" id="imgIn" accept="image/*" hidden></label>
      <button class="tb" id="del" title="選択を削除 (Delete)"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>
    </div>
  </div>
  <div class="stage" id="stage">
    <button class="sheet2" id="sheet2" hidden></button>
    <div class="sheet" id="sheet">
      <canvas id="bgc"></canvas><canvas id="ink"></canvas><div class="objs" id="objs"></div><div class="pgno" id="pgno"></div>
    </div>
  </div>
  <div class="ctx" id="ctx" hidden></div>
  <div class="status">
    <div class="pnav"><button id="pPrev" aria-label="前のページ">‹</button><input id="pNum" inputmode="numeric" aria-label="ページ番号"><span class="of" id="pOf"></span><button id="pNext" aria-label="次のページ">›</button></div>
    <span id="pinfo"></span><span class="sp"></span>
    <span class="hintx">ペン入力は筆圧対応・指はスクロール</span>
    <button id="zout" aria-label="縮小">−</button><span id="zv">100%</span><button id="zin" aria-label="拡大">＋</button>
    <div class="vmode" role="group" aria-label="めくり方"><button id="v1" title="1ページずつ表示">1ページ</button><button id="v2" title="見開きで2ページずつ表示">見開き</button></div>
    <span class="a4">A4</span>
    <button id="addPg2">＋ ページ追加</button><button id="delPg">ページ削除</button>
  </div>
</main>
</div>

<script>
const W=794,H=1123;
const COLORS=['#ffffff','#1f2430','#2c4bd1','#c43d3d','#1f8a5b','#e08a00','#7b3fc4'];
const HL=['#ffe45c','#7cf2a4','#7cd3ff','#ff9ec7'];
const STICKY=['#fff1a8','#ffd6e0','#cdeffd','#d6f5c9'];
const COVERS=['#2c4bd1','#c43d3d','#1f8a5b','#e08a00','#7b3fc4','#3a3f4b'];
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);

function sample(){
  const p1={id:uid(),paper:'cornell',strokes:[],objs:[
    {id:uid(),k:'txt',x:60,y:40,w:600,h:40,text:'線形代数 第3回 — 固有値と固有ベクトル'},
    {id:uid(),k:'txt',x:240,y:140,w:480,h:160,text:'Av = λv\n特性方程式 det(A − λI) = 0\n例) A = [[2,1],[1,2]] → λ = 1, 3'},
    {id:uid(),k:'sticky',x:40,y:150,w:170,h:140,c:STICKY[0],text:'試験に出る！\n対角化の条件'},
    {id:uid(),k:'txt',x:60,y:960,w:640,h:60,text:'まとめ：固有ベクトルは変換で向きが変わらない方向'}]};
  // sample handwriting: a hand-drawn arrow & underline
  p1.strokes.push({t:'hl',c:HL[0],s:14,pts:[[240,200],[600,200]].map(([x,y])=>[x,y,.5])});

      x.textAlign='start';x.textBaseline='alphabetic'}

$('#bakIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());const d=j&&j.app==='inkfold'?j.data:j;if(!d||!Array.isArray(d.nbs))throw 0;
    const have=new Set(S.nbs.map(n=>n.id));let added=0;d.nbs.forEach(n=>{if(!n||!Array.isArray(n.pages))return;if(have.has(n.id))n={...n,id:uid(),name:n.name+'（復元）'};S.nbs.push(n);added++});
    S.cur=S.nbs.length-1;S.pg=0;hist.length=0;load();save();toast(`${added}冊のノートを復元しました（今あるノートはそのまま残ります）`)}
  catch(err){toast('Inkfoldのバックアップファイルではないため復元できません')}};
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{r.onupdatefound=()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('新しいバージョンがあります。アプリを開き直すと更新されます')})}}).catch(()=>{}))}
// Finderで「このアプリで開く」したPDFを読み込む
if('launchQueue' in window)launchQueue.setConsumer(async lp=>{for(const h of lp.files||[]){const f=await h.getFile();const dt=new DataTransfer();dt.items.add(f);const inp=document.getElementById('pdfIn');inp.files=dt.files;inp.dispatchEvent(new Event('change'))}});
// ストレージを消されにくくする
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
</body></html>
